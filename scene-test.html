<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirbis — проверка кино «Прилёт»</title>
  <link rel="stylesheet" href="scene.css">
  <style>
    body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f9fe; color: #222; }
    .bar { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 12px; flex-wrap: wrap; }
    .bar button { border: none; border-radius: 12px; padding: 10px 18px; font-size: 16px; font-weight: 600; cursor: pointer; background: #5aa9f0; color: #fff; }
    .bar button.f { background: #ff9f43; }
    .bar label { font-size: 14px; color: #555; }
    #log { text-align: center; color: #3a8ad6; min-height: 20px; font-size: 14px; }
    /* «Телефон» — контейнер, в котором играет кино */
    #phone { position: relative; width: 390px; height: 760px; max-width: 100vw; margin: 6px auto 20px; border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 10px 30px rgba(58,138,214,.25); }
    #phone .ph-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8a8a8a; text-align: center; padding: 30px; }
  </style>
</head>
<body>
  <div class="bar">
    <button id="m">▶ Парень (Давид)</button>
    <button id="f" class="f">▶ Девушка (Циля)</button>
    <label><input type="checkbox" id="full"> на весь экран</label>
  </div>
  <div id="log"></div>
  <div id="phone"><div class="ph-empty">Нажми кнопку сверху, чтобы посмотреть кино</div></div>

  <script src="scene.js"></script>
  <script>
    const phone = document.getElementById("phone"), log = document.getElementById("log");
    function run(gender) {
      log.textContent = "Идёт кино…";
      const box = document.getElementById("full").checked ? document.body : phone;
      const t0 = performance.now();
      playArrivalScene(box, { gender, profile: { name: "Тест", gender } }, () => {
        log.textContent = "onDone вызван через " + ((performance.now() - t0) / 1000).toFixed(1) + " с — здесь начнётся квест";
      });
    }
    document.getElementById("m").onclick = () => run("m");
    document.getElementById("f").onclick = () => run("f");
    // Для автоматической проверки: scene-test.html?g=m или ?g=f — запустить сразу
    const g = new URLSearchParams(location.search).get("g");
    if (g) run(g);
  </script>
</body>
</html>
