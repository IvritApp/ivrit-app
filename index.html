<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hirbis</title>
  <!-- Библиотека Telegram -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Оформление -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== ГЛАВНЫЙ ЭКРАН ===== -->
  <!-- ===== ЗНАКОМСТВО (первый запуск): Хибри, имя, пол, завязка истории ===== -->
  <section id="onboarding" hidden>
    <div id="ob-bird-slot"></div>
    <div id="ob-step"></div>
  </section>

  <section id="home">
    <!-- Удод из двух слоёв: тело и крыло отдельно, чтобы крыло могло махать -->
    <div class="bird-wrap" id="homeBird">
      <div class="bubble" id="bubble"></div>
      <div class="bird-rig" id="rig">
        <img class="b-wing" src="assets/udod-wing.png" alt="">
        <img class="b-body" src="assets/udod-body.png" alt="Удод Hirbis">
        <div class="b-carry" id="carry"></div>
      </div>
    </div>
    <h1 class="hello" id="hello">Шалом!</h1>
    <div class="hello-he" dir="rtl">שָׁלוֹם</div>
    <p class="sub">Чем займёмся сегодня?</p>
    <div class="today" id="today"></div>

    <div class="menu">
      <button class="card main" id="go-learn">
        <span class="icon">🎯</span>
        <span class="text">
          <span class="name">Основное обучение</span>
          <span class="desc">Разговорный иврит шаг за шагом</span>
        </span>
        <span class="arrow">›</span>
      </button>

      <button class="card soon" data-soon="Алфавит">
        <span class="icon">אב</span>
        <span class="text">
          <span class="name">Алфавит</span>
          <span class="desc">Буквы и огласовки</span>
        </span>
        <span class="badge">Скоро</span>
      </button>

      <button class="card soon" data-soon="Другие языки">
        <span class="icon">🌍</span>
        <span class="text">
          <span class="name">Другие языки</span>
          <span class="desc">Новые курсы в будущем</span>
        </span>
        <span class="badge">Скоро</span>
      </button>
    </div>
    <button class="link-btn" id="reset-profile">Сменить имя или пол</button>
  </section>

  <!-- ===== ЭКРАН УРОКА ===== -->
  <section id="lesson" hidden>
    <div class="topbar">
      <div class="progress"><div id="progress-bar"></div></div>
      <div class="combo" id="combo"></div>
    </div>
    <main id="screen">Загрузка…</main>
  </section>

  <!-- Красная вспышка по краям экрана при ошибке -->
  <div id="flash"></div>
  <!-- Панель с результатом, выезжает снизу -->
  <div id="feedback"></div>
  <!-- Короткое всплывающее сообщение («Скоро появится») -->
  <div id="toast"></div>
  <!-- Большой огонь на 5, 10, 15 правильных подряд -->
  <div id="milestone"></div>

  <!-- Логика приложения -->
  <script src="app.js"></script>
</body>
</html>
