<!-- Удод Hirbis — черновой векторный маскот (Claude). Анимации: моргает, машет крылом, хохолок покачивается. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="st" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(-25)">
      <rect width="11" height="11" fill="#1f2230"/>
      <rect width="11" height="4.5" fill="#ffffff"/>
    </pattern>
  </defs>
  <!-- хвост -->
  <path d="M82 158 Q52 170 34 188 Q60 190 92 170 Z" fill="url(#st)"/>
  <!-- хохолок -->
  <g id="crest"><animateTransform attributeName="transform" type="rotate" values="0 98 80;2 98 80;0 98 80;-2 98 80;0 98 80" dur="5s" repeatCount="indefinite"/>
    <g transform="rotate(-58 98 74)"><rect x="92" y="26" width="12" height="50" rx="6" fill="#f68a3c"/><path d="M92 32 a6 6 0 0 1 12 0 v3 h-12 z" fill="#1f2230"/><rect x="92" y="35" width="12" height="3.5" fill="#fff"/></g>
    <g transform="rotate(-30 98 74)"><rect x="92" y="18" width="12" height="58" rx="6" fill="#f68a3c"/><path d="M92 24 a6 6 0 0 1 12 0 v3 h-12 z" fill="#1f2230"/><rect x="92" y="27" width="12" height="3.5" fill="#fff"/></g>
    <g transform="rotate(0 98 74)"><rect x="92" y="14" width="12" height="62" rx="6" fill="#f68a3c"/><path d="M92 20 a6 6 0 0 1 12 0 v3 h-12 z" fill="#1f2230"/><rect x="92" y="23" width="12" height="3.5" fill="#fff"/></g>
    <g transform="rotate(30 98 74)"><rect x="92" y="18" width="12" height="58" rx="6" fill="#f68a3c"/><path d="M92 24 a6 6 0 0 1 12 0 v3 h-12 z" fill="#1f2230"/><rect x="92" y="27" width="12" height="3.5" fill="#fff"/></g>
    <g transform="rotate(58 98 74)"><rect x="92" y="26" width="12" height="50" rx="6" fill="#f68a3c"/><path d="M92 32 a6 6 0 0 1 12 0 v3 h-12 z" fill="#1f2230"/><rect x="92" y="35" width="12" height="3.5" fill="#fff"/></g>
  </g>
  <!-- ноги -->
  <g stroke="#6b6f7c" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M92 168 L90 186 M82 188 L98 188"/>
    <path d="M110 168 L112 186 M105 188 L121 188"/>
  </g>
  <!-- поднятое крыло (машет) -->
  <g id="wave"><animateTransform attributeName="transform" type="rotate" values="0 76 116;-14 76 116;0 76 116;-14 76 116;0 76 116;0 76 116" keyTimes="0;0.12;0.24;0.36;0.48;1" dur="3.5s" repeatCount="indefinite"/><path d="M72 120 Q50 104 36 78 Q62 84 82 108 Z" fill="url(#st)"/></g>
  <!-- тело и голова -->
  <ellipse cx="101" cy="134" rx="38" ry="40" fill="#f9b27c"/>
  <circle cx="101" cy="88" r="32" fill="#f9b27c"/>
  <ellipse cx="106" cy="141" rx="22" ry="25" fill="#fdecd2"/>
  <!-- сложенное крыло -->
  <path d="M130 112 Q146 138 136 166 Q122 150 124 116 Z" fill="url(#st)"/>
  <!-- щёчка -->
  <circle cx="87" cy="100" r="5.5" fill="#ef8a63" opacity=".5"/>
  <!-- глаза -->
  <g transform="translate(110 83)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;1 0.1;1 1" keyTimes="0;0.92;0.96;1" dur="4s" repeatCount="indefinite"/><g transform="translate(-110 -83)"><g id="eyes">
    <ellipse cx="98" cy="84" rx="9.5" ry="10" fill="#fff"/>
    <ellipse cx="120" cy="82" rx="8.5" ry="9" fill="#fff"/>
    <ellipse cx="101" cy="85" rx="5.8" ry="6.2" fill="#1f2230"/>
    <ellipse cx="122" cy="83" rx="5.2" ry="5.6" fill="#1f2230"/>
    <circle cx="103" cy="82.5" r="2" fill="#fff"/>
    <circle cx="124" cy="80.5" r="1.8" fill="#fff"/>
  </g></g></g></g>
  <path d="M91 71 Q98 67 104 70" stroke="#d9773f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M115 69 Q121 66 127 69" stroke="#d9773f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- клюв -->
  <path d="M121 93 Q154 92 184 108 Q152 101 121 103 Z" fill="#565b69"/>
  <!-- улыбка -->
  <path d="M107 100 Q113 105 120 101" stroke="#7a3a1a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>